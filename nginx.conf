resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Upstream backend (force IPv4)
    set $backend http://host.docker.internal:8082;

    # Static assets with long cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy: API -> host bot
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy: WebSocket -> host bot
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Reverse proxy: Prometheus metrics -> host bot
    location /metrics {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA fallback: all other routes -> index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
