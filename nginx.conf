resolver 127.0.0.11 ipv6=off valid=30s;

# The dashboard supplies Alice's control token itself, so the browser does not
# have to hold one. WEB_API_TOKEN is filled in from the container environment
# when nginx starts. The token is added only to requests that come from the
# dashboard's own pages on this machine: a page on another site, or another
# name pointed at this address, gets no token and Alice refuses its commands.
map $host $alice_local_host {
    default      0;
    localhost    1;
    127.0.0.1    1;
    "[::1]"      1;
}
map $http_sec_fetch_site $alice_same_site {
    default      0;
    ""           1;  # not a browser
    same-origin  1;
}
map $http_origin $alice_local_origin {
    default      0;
    ""           1;
    "~^https?://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$" 1;
}
# A token the caller sent itself is passed through unchanged.
map "$alice_local_host$alice_same_site$alice_local_origin:$http_authorization" $alice_api_auth {
    default      $http_authorization;
    "111:"       "Bearer ${WEB_API_TOKEN}";
}

server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Upstream backend (force IPv4)
    set $backend http://host.docker.internal:8082;

    # Static assets with long cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy: API -> host bot
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $alice_api_auth;
    }

    # Reverse proxy: WebSocket -> host bot
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Reverse proxy: Prometheus metrics -> host bot
    location /metrics {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA fallback: all other routes -> index.html (React Router)
    # no-cache ensures browser always fetches latest index.html on new builds
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
