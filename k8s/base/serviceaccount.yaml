apiVersion: v1
kind: ServiceAccount
metadata:
  name: alice-bot
  labels:
    app: alice-bot
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alice-bot-role
  labels:
    app: alice-bot
rules:
# Add specific permissions if needed
# - apiGroups: [""]
#   resources: ["configmaps"]
#   verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alice-bot-rolebinding
  labels:
    app: alice-bot
subjects:
- kind: ServiceAccount
  name: alice-bot
  namespace: default
roleRef:
  kind: Role
  name: alice-bot-role
  apiGroup: rbac.authorization.k8s.io