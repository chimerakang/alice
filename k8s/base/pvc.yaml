apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alice-data-pvc
  labels:
    app: alice-bot
    component: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alice-config-pvc
  labels:
    app: alice-bot
    component: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alice-logs-pvc
  labels:
    app: alice-bot
    component: logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: standard