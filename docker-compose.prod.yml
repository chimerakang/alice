version: '3.8'

# Production deployment with full monitoring and security
services:
  alice:
    image: alice:latest
    container_name: alice-prod
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-sonnet}
      - ENABLE_WEB_INTERFACE=true
      - WEB_PORT=8080
      - ENABLE_PERFORMANCE_MONITORING=true
      - ENABLE_RATE_LIMITING=true
      - ENABLE_PII_DETECTION=true
      - ENABLE_AUDIT_LOGGING=true
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - ALLOWED_IPS=${ALLOWED_IPS}
      - BLOCKED_IPS=${BLOCKED_IPS}
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - alice_data:/app/data
      - alice_config:/app/config
      - alice_logs:/app/logs
      - /etc/ssl/certs:/etc/ssl/certs:ro
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - alice-prod-network
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Reverse proxy with SSL termination
  nginx:
    image: nginx:1.24-alpine
    container_name: alice-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - alice-prod-network
    depends_on:
      - alice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production monitoring stack
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: alice-prometheus-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - alice-prod-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  grafana:
    image: grafana/grafana:10.0.0
    container_name: alice-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-localhost}/grafana/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - alice-prod-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'

  # Log aggregation with Loki
  loki:
    image: grafana/loki:2.8.0
    container_name: alice-loki-prod
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki.prod.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - alice-prod-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'

  promtail:
    image: grafana/promtail:2.8.0
    container_name: alice-promtail-prod
    restart: always
    volumes:
      - ./monitoring/promtail.prod.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - alice_logs:/app/logs:ro
      - nginx_logs:/nginx/logs:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - alice-prod-network
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true

  # Alertmanager for production alerts
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alice-alertmanager
    restart: always
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - alice-prod-network
    security_opt:
      - no-new-privileges:true

  # Node exporter for system metrics
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: alice-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - alice-prod-network
    security_opt:
      - no-new-privileges:true

volumes:
  alice_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data
  alice_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/config
  alice_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/logs
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/monitoring/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/monitoring/grafana
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/monitoring/loki
  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/monitoring/alertmanager
  nginx_logs:
    driver: local

networks:
  alice-prod-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: alice-prod-br
    ipam:
      config:
        - subnet: 172.21.0.0/16